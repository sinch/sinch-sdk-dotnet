name: Notify Private Repo of Update

# The internal repository is on GitLab. On every push to the public repository,
# trigger its sync-from-public pipeline (see .gitlab-ci.yml).
# GITLAB_SYNC_TRIGGER_TOKEN is a pipeline trigger token of the GitLab project.

env:
  SDK_NAME: sinch-sdk-dotnet
  GITLAB_PROJECT_ID: '88758904'

on:
  push:

jobs:
  ping-private:
    # Skip pushes made by the sync from the internal repo, so they are not sent back.
    if: |
      github.actor != 'sinch-internal-repo-sync-bot[bot]' && !endsWith(github.event.repository.name, 'internal')

    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-from-public pipeline on GitLab
        env:
          TRIGGER_TOKEN: ${{ secrets.GITLAB_SYNC_TRIGGER_TOKEN }}
        run: |
          curl -X POST --fail-with-body --silent --show-error --output /dev/null \
            -F "token=${TRIGGER_TOKEN}" \
            -F "ref=main" \
            -F "variables[SYNC_FROM_PUBLIC]=true" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline"
